apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: Request ID
          matcherRegex: '"(?:request_id|downstream_X-Request-Id)":"([A-Za-z0-9._-]+)"'
          url: '/d/pokerlost-local?var-request_id=$${__value.raw}'
