global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: foundation
    metrics_path: /metrics
    static_configs:
      - targets: [auth:8000]
        labels: {service_id: authService, environment: local}
      - targets: [accounts:8000]
        labels: {service_id: accountsService, environment: local}
      - targets: [virtual-money:8000]
        labels: {service_id: virtualMoney, environment: local}
      - targets: [poker:8000]
        labels: {service_id: pokerService, environment: local}
      - targets: [crypto:8000]
        labels: {service_id: cryptoService, environment: local}
  - job_name: gateway
    static_configs:
      - targets: [gateway:8082]
        labels: {service_id: pokerGateway, environment: local}
  - job_name: collector
    static_configs:
      - targets: [alloy:12345]
        labels: {service_id: alloy, environment: local}
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels: {service_id: loki, environment: local}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: {service_id: prometheus, environment: local}
