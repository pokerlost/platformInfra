name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/actionlint
      - uses: ./.github/actions/deployment-tools
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore pinned Docker adapter and Kubernetes test tools
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: platforminfra:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Fresh adapter checks and Compose/Helm validation
        run: make check config-check
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: infrastructure-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/deployment-tools
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore pinned Docker adapter and Kubernetes test tools
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: platforminfra:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Native Helm PostgreSQL and real TCP authentication with generated Secrets
        run: |
          set -euo pipefail
          cluster="poker-platform-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config="$RUNNER_TEMP/infra-database.kubeconfig"
          docker pull postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          docker tag postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 foundation-postgres:local-2d2b8998d310
          kind create cluster --name "$cluster" --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$config" --wait 120s
          kind load docker-image foundation-postgres:local-2d2b8998d310 --name "$cluster"
          kubectl --kubeconfig "$config" --context "kind-$cluster" create namespace foundation
          make kube-secrets CLUSTER_NAME="$cluster" LOCAL_KUBECONFIG="$config"
          helm upgrade --install platform-databases deploy/local-postgres --kubeconfig "$config" --kube-context "kind-$cluster" --namespace foundation --set localDevelopment=true --set image=foundation-postgres:local-2d2b8998d310 --wait --timeout 180s
          PLATFORM_TEST_KIND_NAME="$cluster" PLATFORM_TEST_KUBECONFIG="$config" make test-database
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-postgres-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/postgres.xml
          retention-days: 14
          if-no-files-found: error
      - name: Delete only this run's local Kind cluster
        if: always()
        run: kind delete cluster --name "poker-platform-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
  required:
    if: always()
    needs: [infrastructure, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: {INFRA: '${{ needs.infrastructure.result }}', DATABASE: '${{ needs.database.result }}'}
        run: test "$INFRA" = success && test "$DATABASE" = success
