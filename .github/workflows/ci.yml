name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/actionlint
      - uses: ./.github/actions/deployment-tools
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14
      - run: make install check preview-values
      - name: Check native Compose and Helm contracts without pulling unavailable images
        run: |
          set -euo pipefail
          docker compose --project-name infra-ci --file compose.yaml --env-file .local/generated/compose.env config --quiet
          helm lint .local/generated/charts/web.tgz --strict --values .local/generated/web.values.json
          helm lint .local/generated/charts/gateway.tgz --strict --values .local/generated/gateway.values.json
          helm lint deploy/local-postgres --strict --set localDevelopment=true --set image=postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: infrastructure-checks-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/deployment-tools
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14 && make install
      - name: Native Helm PostgreSQL and real TCP authentication with generated Secrets
        run: |
          set -euo pipefail
          cluster="poker-platform-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config="$RUNNER_TEMP/infra-database.kubeconfig"
          docker pull postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          docker tag postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 foundation-postgres:local-2d2b8998d310
          kind create cluster --name "$cluster" --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$config" --wait 120s
          kind load docker-image foundation-postgres:local-2d2b8998d310 --name "$cluster"
          kubectl --kubeconfig "$config" --context "kind-$cluster" create namespace foundation
          make kube-secrets CLUSTER_NAME="$cluster" LOCAL_KUBECONFIG="$config"
          helm upgrade --install platform-databases deploy/local-postgres --kubeconfig "$config" --kube-context "kind-$cluster" --namespace foundation --set localDevelopment=true --set image=foundation-postgres:local-2d2b8998d310 --wait --timeout 180s
          PLATFORM_TEST_KIND_NAME="$cluster" PLATFORM_TEST_KUBECONFIG="$config" make test-database
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-postgres-checks-${{ github.sha }}
          path: coverage/postgres.xml
          retention-days: 14
          if-no-files-found: error
      - name: Delete only this run's local Kind cluster
        if: always()
        run: kind delete cluster --name "poker-platform-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
  required:
    if: always()
    needs: [infrastructure, database]
    runs-on: ubuntu-24.04
    steps:
      - env: {RESULTS: '${{ toJSON(needs) }}'}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
