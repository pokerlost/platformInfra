name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/actionlint
      - uses: ./.github/actions/deployment-tools
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14.7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore pinned Docker adapter and Kubernetes test tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: platforminfra:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Fresh adapter checks and Compose/Helm validation
        run: make ci-local CI_LOCAL_TARGETS="check coverage build config-check release-check"
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: infrastructure-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: ./.github/actions/deployment-tools
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14.7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore pinned Docker adapter and Kubernetes test tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: platforminfra:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Native Helm PostgreSQL and real TCP authentication with generated Secrets
        run: make test-database-local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-postgres-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/postgres.xml
          retention-days: 14
          if-no-files-found: error
  required:
    if: always()
    needs: [infrastructure, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: {INFRA: '${{ needs.infrastructure.result }}', DATABASE: '${{ needs.database.result }}'}
        run: test "$INFRA" = success && test "$DATABASE" = success
